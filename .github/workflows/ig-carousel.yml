name: Publicar carrusel en Instagram

on:
  schedule:
    # Objetivo: publicar 1 por la mañana (~08:00) y 1 por la tarde (~20:00) hora ES.
    # El cron de GitHub va en UTC y suele RETRASARSE (a veces >1-2 h), así que
    # disparamos varias veces en cada franja; el script publica como mucho 1 vez
    # por franja (control 'done_slots'). Ventanas: mañana 08-16 y tarde 20-24 Madrid.
    - cron: "0 6,8,10,18,19,20 * * *"
  workflow_dispatch:            # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      dry_run:
        description: "Prueba sin publicar (1 = sí)"
        default: "0"
      only:
        description: "Forzar un barco (nombre de carpeta, opcional)"
        default: ""

permissions:
  contents: write               # para poder commitear state.json actualizado

concurrency:                    # nunca dos publicaciones a la vez (evita duplicados)
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publicar siguiente carrusel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IMG_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/carruseles"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY: ${{ github.event.inputs.only }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_HOURS: "8,20"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREADS: ${{ vars.TG_THREADS }}
        run: python publish_ig.py

      - name: Guardar estado (commit state.json)
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreplace.github.com"
          git add state.json
          git commit -m "estado: publicado siguiente carrusel" || echo "sin cambios"
          git push
